name: ottlog
services:
  api:
    image: ottlog-api:${OTTLOG_RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: backend/Ottlog.Api/Dockerfile
    restart: unless-stopped
    environment:
      Admin__UserName: admin
      Admin__PasswordFile: /run/secrets/admin_password
      Site__Url: https://ohtautau.com
      SeedExamples: 'false'
      ReverseProxy__Address: 172.30.41.2
      WeChat__AppSecret: ${WECHAT_APP_SECRET:-}
    secrets: [admin_password]
    group_add: ['${OTTLOG_SECRET_GID:-1000}']
    volumes: [blog_data:/data]
    networks:
      blog:
        ipv4_address: 172.30.41.3
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: ottlog-web:${OTTLOG_RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks:
      blog:
        ipv4_address: 172.30.41.4
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    networks:
      blog:
        ipv4_address: 172.30.41.2
    logging: *logging
  backup:
    image: python:3.13-alpine
    profiles: [tools]
    volumes: ['blog_data:/data:ro', '${OTTLOG_BACKUP_DIRECTORY:-../backups}:/backups', '../scripts:/scripts:ro']
    command: [python, /scripts/backup.py, /data, /backups]
  restore:
    image: python:3.13-alpine
    profiles: [tools]
    volumes: ['blog_data:/data', '${OTTLOG_BACKUP_DIRECTORY:-../backups}:/backups:ro', '../scripts:/scripts:ro']
    entrypoint: [python, /scripts/backup.py]
networks:
  blog:
    ipam:
      config: [{subnet: 172.30.41.0/24}]
volumes:
  blog_data:
  caddy_data:
  caddy_config:
secrets:
  admin_password:
    file: ${OTTLOG_ADMIN_PASSWORD_FILE:-./admin-password.txt}
